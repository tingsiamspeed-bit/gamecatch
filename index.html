<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เกมนักสำรวจ Flowchart</title>

<style>
:root{
  --green:#2f6846;
  --green2:#5f8f61;
  --light:#e8f2df;
  --cream:#fffaf0;
  --brown:#795548;
  --text:#243b2d;
  --gold:#c58a32;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:"Tahoma","Arial",sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#ffffff99 0 40px,transparent 41px),
    linear-gradient(135deg,#dcebd5,#fff8e8,#d7e8d4);
  color:var(--text);
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px 14px 40px;
}

/* =========================
   หน้าเริ่มเกม
========================= */

.start-screen{
  max-width:600px;
  margin:40px auto;
  background:#fffdf5;
  border:3px solid #a9c59e;
  border-radius:30px;
  padding:30px 24px;
  box-shadow:0 12px 35px #36543825;
  text-align:center;
}

.title{
  margin:0;
  font-size:clamp(28px,7vw,42px);
  font-weight:900;
  background:linear-gradient(
    90deg,
    #23613c,
    #668c3c,
    #9b683e
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.start-icon{
  font-size:70px;
  margin-bottom:5px;
}

.start-subtitle{
  color:#58705b;
  font-size:17px;
  font-weight:bold;
  margin:8px 0 25px;
}

.form-group{
  text-align:left;
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:17px;
  font-weight:900;
  color:#315d40;
  margin-bottom:7px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:14px 15px;
  border:2px solid #b8cda9;
  border-radius:14px;
  background:#f9fcf5;
  color:#294d3a;
  font-size:17px;
  font-weight:bold;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:#477a58;
  box-shadow:0 0 0 4px #477a5820;
}

.start-button{
  width:100%;
  min-height:58px;
  margin-top:8px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#356f4b,#6c964e);
  color:white;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #285239;
}

.start-button:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

.error{
  color:#b33c2d;
  font-weight:bold;
  min-height:24px;
  margin-top:10px;
}

/* =========================
   เกม
========================= */

#gameScreen{
  display:none;
}

.header{
  text-align:center;
  background:#ffffffdd;
  border:2px solid #a9c59e;
  border-radius:28px;
  padding:20px;
  box-shadow:0 8px 25px #36543822;
}

.game-title{
  margin:0;
  font-size:clamp(27px,7vw,40px);
  font-weight:900;
  background:linear-gradient(90deg,#23613c,#668c3c,#9b683e);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.player-info{
  margin-top:8px;
  color:#58705b;
  font-weight:800;
}

.stats{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.badge{
  background:#f3f8ed;
  border:2px solid #b8cda9;
  padding:8px 18px;
  border-radius:50px;
  font-weight:900;
  color:#315d40;
}

.game{
  margin-top:16px;
  background:var(--cream);
  border:2px solid #d7c59f;
  border-radius:26px;
  padding:20px;
  box-shadow:0 10px 30px #684d2b18;
}

.progress-bg{
  height:12px;
  background:#e2dbc9;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:18px;
}

.progress{
  height:100%;
  width:10%;
  background:linear-gradient(90deg,#3d754e,#83a84f);
  transition:.4s;
}

.symbol{
  min-height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#f5f2e3,#e5efdf);
  border:2px dashed #a5bd99;
  border-radius:20px;
}

.symbol svg{
  width:min(310px,90%);
  height:170px;
}

.question{
  text-align:center;
  font-size:22px;
  font-weight:900;
  color:#294f39;
  margin:18px 5px;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.answer{
  min-height:62px;
  border:2px solid #c7c9b9;
  border-radius:15px;
  background:#fff;
  color:#304b39;
  font-size:17px;
  font-weight:800;
  padding:10px 15px;
  cursor:pointer;
  text-align:left;
  box-shadow:0 4px 0 #ddd7c6;
  transition:.15s;
}

.answer:hover{
  transform:translateY(-2px);
}

.answer.correct{
  background:#dff1df;
  border-color:#4d9660;
  color:#236039;
}

.answer.wrong{
  background:#fae0db;
  border-color:#c45a4a;
  color:#8b3025;
}

.answer:disabled{
  cursor:default;
}

.result{
  text-align:center;
  min-height:32px;
  margin:16px 0 5px;
  font-size:19px;
  font-weight:900;
}

.next,
.restart{
  width:100%;
  min-height:52px;
  border:0;
  border-radius:15px;
  background:linear-gradient(135deg,#356f4b,#5c8b50);
  color:white;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 5px 0 #285239;
}

.restart{
  margin-top:8px;
}

.memory{
  margin-top:18px;
  padding:15px;
  border-radius:18px;
  background:#edf5e7;
  border:1px solid #c0d3b4;
}

.memory-title{
  font-weight:900;
  color:#315d40;
  margin-bottom:8px;
}

.memory span{
  display:inline-block;
  margin:4px 8px 4px 0;
  font-size:14px;
  font-weight:bold;
  color:#435a48;
}

@media(max-width:600px){

  .container{
    padding:12px 10px 30px;
  }

  .start-screen{
    margin:20px auto;
    padding:25px 18px;
  }

  .game{
    padding:14px;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .question{
    font-size:19px;
  }

  .answer{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- =========================
     หน้าเริ่มเกม
========================= -->

<section id="startScreen" class="start-screen">

  <div class="start-icon">🌿🎮</div>

  <h1 class="title">
    เกมนักสำรวจ Flowchart
  </h1>

  <div class="start-subtitle">
    กรอกข้อมูลผู้เล่นก่อนเริ่มเกม
  </div>

  <div class="form-group">

    <label for="playerName">
      👤 ชื่อ - นามสกุล
    </label>

    <input
      type="text"
      id="playerName"
      placeholder="กรอกชื่อผู้เล่น"
      autocomplete="name"
    >

  </div>


  <div class="form-group">

    <label for="classRoom">
      🏫 ชั้นเรียน
    </label>

    <select id="classRoom">

      <option value="">
        -- เลือกชั้นเรียน --
      </option>

      <option>ป.1</option>
      <option>ป.2</option>
      <option>ป.3</option>
      <option>ป.4</option>
      <option>ป.5</option>
      <option>ป.6</option>

      <option>ม.1</option>
      <option>ม.2</option>
      <option>ม.3</option>
      <option>ม.4</option>
      <option>ม.5</option>
      <option>ม.6</option>

    </select>

  </div>


  <div id="error" class="error"></div>


  <button
    class="start-button"
    id="startButton">
    🚀 ตกลง เริ่มเกม
  </button>

</section>


<!-- =========================
     หน้าเกม
========================= -->

<section id="gameScreen">

<header class="header">

  <h1 class="game-title">
    🌿 เกมนักสำรวจ Flowchart
  </h1>

  <div class="player-info">

    👤 <span id="displayName"></span>
    &nbsp; | &nbsp;
    🏫 <span id="displayClass"></span>

  </div>

  <div class="stats">

    <div class="badge">
      📗 ข้อ
      <span id="questionNumber">1</span>
      / 10
    </div>

    <div class="badge">
      ⭐ คะแนน
      <span id="score">0</span>
      / 10
    </div>

  </div>

</header>


<main class="game">

<div class="progress-bg">
  <div class="progress" id="progress"></div>
</div>


<div class="symbol" id="symbol"></div>


<div class="question" id="question"></div>


<div class="answers" id="answers"></div>


<div class="result" id="result"></div>


<button
  class="next"
  id="nextButton"
  hidden>
  ข้อถัดไป ➜
</button>


<button
  class="restart"
  id="restartButton"
  hidden>
  🔄 เล่นอีกครั้ง
</button>


<div class="memory">

<div class="memory-title">
🌱 จำง่าย 5 สัญลักษณ์สำคัญ
</div>

<span>⬭ วงรี = เริ่ม / จบ</span>
<span>▭ สี่เหลี่ยม = กระบวนการ</span>
<span>▱ ด้านขนาน = รับ / แสดงผล</span>
<span>◇ ข้าวหลามตัด = เงื่อนไข</span>
<span>→ ลูกศร = ทิศทาง</span>

</div>

</main>

</section>

</div>


<script>

const questions=[

{
type:"ellipse",
question:"สัญลักษณ์นี้หมายถึงอะไร?",
answers:[
"เริ่มต้น / สิ้นสุด",
"รับข้อมูล / แสดงผล",
"ตรวจสอบเงื่อนไข",
"ประมวลผล"
],
correct:0
},

{
type:"rectangle",
question:"สัญลักษณ์นี้ใช้แทนอะไร?",
answers:[
"จุดเชื่อมต่อ",
"ประมวลผล / ขั้นตอนการทำงาน",
"เริ่มต้น / สิ้นสุด",
"ทิศทางการทำงาน"
],
correct:1
},

{
type:"parallelogram",
question:"สัญลักษณ์นี้ใช้สำหรับอะไร?",
answers:[
"รับข้อมูล / แสดงผล",
"ตรวจสอบเงื่อนไข",
"เริ่มต้น / สิ้นสุด",
"เชื่อมต่อผังงาน"
],
correct:0
},

{
type:"diamond",
question:"รูปข้าวหลามตัดใช้แทนอะไร?",
answers:[
"ประมวลผล",
"ตรวจสอบเงื่อนไข",
"รับข้อมูล",
"เริ่มต้น"
],
correct:1
},

{
type:"arrow",
question:"ลูกศรใน Flowchart มีหน้าที่อะไร?",
answers:[
"รับข้อมูล",
"แสดงทิศทางการทำงาน",
"ตรวจสอบเงื่อนไข",
"แสดงผลลัพธ์"
],
correct:1
},

{
type:"circle",
question:"วงกลมเล็กในผังงานใช้ทำอะไร?",
answers:[
"เชื่อมต่อส่วนต่าง ๆ ของผังงาน",
"จบโปรแกรม",
"คำนวณตัวเลข",
"รับข้อมูล"
],
correct:0
},

{
type:"diamond",
question:"ถ้าต้องการตรวจว่า คะแนน ≥ 50 หรือไม่ ควรใช้สัญลักษณ์ใด?",
answers:[
"วงรี",
"ข้าวหลามตัด",
"สี่เหลี่ยมผืนผ้า",
"ลูกศร"
],
correct:1
},

{
type:"parallelogram",
question:"ถ้าต้องการ “รับชื่อจากผู้ใช้” ควรใช้สัญลักษณ์ใด?",
answers:[
"วงรี",
"สี่เหลี่ยมด้านขนาน",
"ข้าวหลามตัด",
"วงกลม"
],
correct:1
},

{
type:"rectangle",
question:"ถ้าต้องการ “คำนวณ A + B” ควรใช้สัญลักษณ์ใด?",
answers:[
"สี่เหลี่ยมผืนผ้า",
"วงรี",
"ลูกศร",
"ข้าวหลามตัด"
],
correct:0
},

{
type:"ellipse",
question:"สัญลักษณ์ใดเหมาะกับข้อความ “จบการทำงาน”?",
answers:[
"สี่เหลี่ยมด้านขนาน",
"ข้าวหลามตัด",
"วงรี",
"สี่เหลี่ยมผืนผ้า"
],
correct:2
}

];


let currentQuestion=0;
let score=0;
let answered=false;


/* หน้าเริ่มเกม */

document.getElementById("startButton").onclick=function(){

const name=
document.getElementById("playerName").value.trim();

const classroom=
document.getElementById("classRoom").value;

const error=
document.getElementById("error");


if(name===""){

error.textContent=
"⚠️ กรุณากรอกชื่อผู้เล่น";

return;

}


if(classroom===""){

error.textContent=
"⚠️ กรุณาเลือกชั้นเรียน";

return;

}


/* แสดงข้อมูลผู้เล่น */

document.getElementById("displayName").textContent=name;

document.getElementById("displayClass").textContent=classroom;


/* ซ่อนหน้าเริ่มเกม */

document.getElementById("startScreen").style.display="none";

document.getElementById("gameScreen").style.display="block";


currentQuestion=0;
score=0;

showQuestion();

};


/* วาดสัญลักษณ์ */

function drawSymbol(type){

if(type==="ellipse"){

return `
<svg viewBox="0 0 320 180">

<ellipse
cx="160"
cy="90"
rx="120"
ry="55"
fill="#fffdf5"
stroke="#477a58"
stroke-width="6"/>

<text
x="160"
y="98"
text-anchor="middle"
font-size="23"
font-weight="bold"
fill="#294d3a">
เริ่ม / จบ
</text>

</svg>`;

}


if(type==="rectangle"){

return `
<svg viewBox="0 0 320 180">

<rect
x="50"
y="35"
width="220"
height="110"
fill="#fffdf5"
stroke="#477a58"
stroke-width="6"/>

<text
x="160"
y="100"
text-anchor="middle"
font-size="24"
font-weight="bold"
fill="#294d3a">
Process
</text>

</svg>`;

}


if(type==="parallelogram"){

return `
<svg viewBox="0 0 320 180">

<polygon
points="75,35 285,35 245,145 35,145"
fill="#fffdf5"
stroke="#477a58"
stroke-width="6"/>

<text
x="160"
y="101"
text-anchor="middle"
font-size="21"
font-weight="bold"
fill="#294d3a">
Input / Output
</text>

</svg>`;

}


if(type==="diamond"){

return `
<svg viewBox="0 0 320 180">

<polygon
points="160,15 290,90 160,165 30,90"
fill="#fffdf5"
stroke="#477a58"
stroke-width="6"/>

<text
x="160"
y="98"
text-anchor="middle"
font-size="23"
font-weight="bold"
fill="#294d3a">
เงื่อนไข?
</text>

</svg>`;

}


if(type==="arrow"){

return `
<svg viewBox="0 0 320 180">

<line
x1="35"
y1="90"
x2="255"
y2="90"
stroke="#477a58"
stroke-width="9"/>

<polygon
points="285,90 245,62 245,118"
fill="#477a58"/>

</svg>`;

}


return `
<svg viewBox="0 0 320 180">

<circle
cx="160"
cy="90"
r="52"
fill="#fffdf5"
stroke="#477a58"
stroke-width="6"/>

<text
x="160"
y="100"
text-anchor="middle"
font-size="28"
font-weight="bold"
fill="#294d3a">
A
</text>

</svg>`;

}


/* แสดงคำถาม */

function showQuestion(){

answered=false;

const q=
questions[currentQuestion];

document.getElementById("questionNumber")
.textContent=currentQuestion+1;

document.getElementById("score")
.textContent=score;

document.getElementById("progress")
.style.width=
((currentQuestion+1)/10*100)+"%";

document.getElementById("symbol")
.innerHTML=
drawSymbol(q.type);

document.getElementById("question")
.textContent=q.question;

document.getElementById("result")
.textContent="";

document.getElementById("nextButton")
.hidden=true;

document.getElementById("restartButton")
.hidden=true;


const answers=
document.getElementById("answers");

answers.innerHTML="";


q.answers.forEach((answer,index)=>{

const button=
document.createElement("button");

button.className="answer";

button.textContent=answer;

button.onclick=
()=>checkAnswer(index,button);

answers.appendChild(button);

});

}


/* ตรวจคำตอบ */

function checkAnswer(index,button){

if(answered)return;

answered=true;

const q=
questions[currentQuestion];

const allButtons=
document.querySelectorAll(".answer");

allButtons.forEach(
button=>button.disabled=true
);


if(index===q.correct){

score++;

button.classList.add("correct");

document.getElementById("result")
.textContent=
"🎉 ถูกต้อง! +1 คะแนน";

}else{

button.classList.add("wrong");

allButtons[q.correct]
.classList.add("correct");

document.getElementById("result")
.textContent=
"🌱 ยังไม่ถูก คำตอบคือ “"+
q.answers[q.correct]+"”";

}


document.getElementById("score")
.textContent=score;

document.getElementById("nextButton")
.hidden=false;

}


/* ข้อถัดไป */

document.getElementById("nextButton")
.onclick=function(){

if(currentQuestion<questions.length-1){

currentQuestion++;

showQuestion();

}else{

document.getElementById("symbol")
.innerHTML="🎉";

document.getElementById("question")
.textContent=
"จบเกมแล้ว!";

document.getElementById("answers")
.innerHTML="";

document.getElementById("result")
.textContent=
"🌟 "+document.getElementById("displayName").textContent+
" ได้คะแนน "+score+" / 10 คะแนน";

document.getElementById("nextButton")
.hidden=true;

document.getElementById("restartButton")
.hidden=false;

}

};


/* เล่นใหม่ */

document.getElementById("restartButton")
.onclick=function(){

currentQuestion=0;

score=0;

showQuestion();

};

</script>

</body>
</html>
